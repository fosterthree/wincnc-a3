function unit(){return units[state.unit];}
function drawPos(){
 const [sym,f]=unit();set('position-unit','('+sym+')');set('speed-unit','('+sym+'/MIN)');
 axes.forEach((a,i)=>{for(const [key,val] of [['pos'+a,(state.pos[i]*f).toFixed(3)],['feed'+a,(state.feed[i]*f*state.override/100).toFixed(2).replace(/\.00$/,'')]]){
   set(key+'-text',val);if(document.activeElement!==$control(key))$control(key).value=val;
 }});
 const x=435+clamp(state.pos[0],0,48)*5.84,y=750-clamp(state.pos[1],0,96)*5.84;
 attr('head','transform','translate('+x+' '+y+')');
}
function drawOverride(){
 const y=503-(state.override-5)*86/195;
 attr('override-knob','cy',y);attr('override-fill','y',y);attr('override-fill','height',503-y);
 set('override-value',state.override+'%');$control('override').setAttribute('aria-valuetext',state.override+' percent');
 drawPos();
}
function drawRack(){
 const nSel=state.selected.size;
 for(let n=1;n<=12;n++){
  const key='tool'+n,active=n===state.tool,chosen=state.selected.has(n);
  attr(key+'-bg','fill',active?'#7d71f5':chosen?'#e8e2ff':'#f7f7fb');
  attr(key+'-bg','stroke',chosen?'#4d369a':active?'#5343aa':'#dddce8');
  attr(key+'-bg','stroke-width',chosen?2.6:1);
  attr(key+'-bit','color',active?'white':'#656579');attr(key+'-label','fill',active?'white':'#262535');
  $control(key).setAttribute('aria-pressed',String(chosen));
 }
 set('active-tool','48 × 96 IN · '+(state.tool?'T'+state.tool:'NO TOOL'));attr('active-tool','opacity',nSel?0:1);
 set('head-tool',state.tool?'T'+state.tool:'—');
 set('measure-text','MEASURE ('+nSel+')');for(const id of ['measure-bg','measure-text'])attr(id,'opacity',nSel?1:0);
 $control('measure').hidden=!nSel;
}
function drawButtons(){
 for(const key of ['spindle','vacuum','table','boot','gate']){
  shade(key,state[key]);set(key+'-state',state[key]?'ON':'OFF');$control(key).setAttribute('aria-pressed',String(state[key]));
  attr(key+'-dot','fill',state[key]?'#4fdb65':'#e04343');
 }
 for(const [i,dist] of steps.entries()){
  const key='inc'+i,on=!state.transit&&dist===state.inc;shade(key,on);$control(key).setAttribute('aria-pressed',String(on));
 }
 for(const k of Object.keys(preset)){shade(k,state.transit===k);$control(k).setAttribute('aria-pressed',String(state.transit===k));}
 const p=(state.rpm-minRPM)/(maxRPM-minRPM);attr('rpm-fill','width',316*p);attr('rpm-knob','cx',32+316*p);set('rpm-text',state.rpm.toLocaleString('en-US')+' RPM');$control('rpm').value=state.rpm;
}
function drawState(){
 const idle=state.mode==='ready',stopped=state.mode==='stopped';
 const playLabel=state.mode==='run'?'PAUSE':state.mode==='paused'?'RESUME':'START';
 attr('run-icon','d',state.mode==='run'?'M324 76h4v16h-4z M332 76h4v16h-4z':'M324 76 L336 84 L324 92 Z');
 for(const [key,label] of [['start',playLabel],['estop',stopped?'RESET SIMULATED E-STOP':'E-STOP']]){
  $control(key).title=label;$control(key).setAttribute('aria-label',label);
 }
 for(const c of spec){if(c.kind==='menu'||['estop','history'].includes(c.key))continue;
  if(c.key==='override'){$control(c.key).disabled=!['ready','run','paused'].includes(state.mode);continue;}
  $control(c.key).disabled=c.key==='start'?(!['ready','run','paused'].includes(state.mode)):!idle;
 }drawRack();drawPos();drawButtons();
}
function showDialog(title,body,action,fn){
 const dlg=by('dialog');if(dlg.open)dlg.close();set('dlg-title',title);by('dlg-body').replaceChildren();
 if(typeof body==='string'){const p=document.createElement('p');p.textContent=body;by('dlg-body').append(p);}else by('dlg-body').append(body);
 const button=by('dlg-action');button.hidden=!action;button.textContent=action||'';button.onclick=()=>{if(fn?.()!==false)dlg.close();};dlg.showModal();
}
function showHistory(){
 const box=document.createElement('ol');box.className='history';
 for(const [t,m] of historyRows){const row=document.createElement('li');const time=document.createElement('span');time.textContent=t;row.append(time,document.createTextNode(m));box.append(row);}
 showDialog('TERMINAL HISTORY',box);
}
function pickup(n){state.tool=n;state.selected.clear();drawRack();writeLog(n?'T'+n+' PICKED UP':'TOOL UNLOADED');}
function measure(ns,batch){
 if(!ns.length||state.mode!=='ready')return;
 for(const n of ns){state.tool=n;writeLog('T'+n+' MEASURED (SIMULATED)');}
 if(batch){state.tool=0;writeLog(ns.length+' MEASURED · TOOL UNLOADED');}
 state.selected.clear();drawRack();
}
function setJog(k){
 if(state.mode!=='ready')return;
 if(k.startsWith('inc')){state.inc=steps[Number(k.slice(3))];state.transit=null;writeLog('JOG INCREMENT '+state.inc+' IN');}
 else{state.transit=k;const [xy,,z]=preset[k];writeLog(k+' · XY '+xy+' / Z '+z+' IN/MIN');}drawButtons();
}
function axisMove(k,seconds){
 const i=axes.indexOf(k[0].toUpperCase());const amount=state.transit?preset[state.transit][i]*seconds/60:state.inc;
 const bounds=[[-1.318,49.687],[-1.824,104.252],[-12,6]];state.pos[i]=clamp(state.pos[i]+(k[1]==='p'?1:-1)*amount,...bounds[i]);drawPos();
}
function stopJog(){clearInterval(jogTimer);jogTimer=0;}
function pointerJog(e,k){
 if(e.button!==0||state.mode!=='ready')return;e.preventDefault();stopJog();e.currentTarget.setPointerCapture?.(e.pointerId);
 if(!state.transit){axisMove(k,0);return;}
 let prev=performance.now();axisMove(k,.025);jogTimer=setInterval(()=>{const now=performance.now();axisMove(k,Math.min(.1,(now-prev)/1000));prev=now;},35);
}
function cancelMotion(){cancelAnimationFrame(frame);clearTimeout(warmTimer);stopJog();lastTime=0;}
let previewRapid=false;
function frameStep(t){
 if(state.mode!=='run')return;
 if(lastTime)elapsed+=Math.min(.15,(t-lastTime)/1000)*20*(previewRapid?1:state.override/100);lastTime=t;
 if(elapsed>=total){elapsed=total;endMaintenance();state.mode='ready';state.spindle=false;drawState();writeLog('JOB PREVIEW COMPLETE');return;}
 let d=elapsed;for(const {p,len} of sections){if(d<=len){previewRapid=p.hasAttribute('stroke-dasharray');const pt=p.getPointAtLength(d);state.pos=[pt.x,pt.y,state.pos[2]];break;}d-=len;}
 drawPos();frame=requestAnimationFrame(frameStep);
}
function runJob(){
 if(state.mode==='run'){cancelMotion();state.mode='paused';state.spindle=false;drawState();writeLog('JOB PREVIEW PAUSED');return;}
 if(!['ready','paused'].includes(state.mode))return;
 if(!sections.length){writeLog('XY PREVIEW UNAVAILABLE FOR THIS FILE');return;}
 if(state.mode==='ready'){elapsed=0;previewRapid=sections[0].p.hasAttribute('stroke-dasharray');}
 state.mode='run';state.spindle=maintenance!=='sweep';drawState();writeLog('RUNNING JOB PREVIEW');frame=requestAnimationFrame(frameStep);
}
function estop(){
 if(state.mode==='stopped'){showDialog('RESET E-STOP','RETURN THE SIMULATED CONTROLLER TO IDLE?','RESET',()=>{state.mode='ready';drawState();writeLog('STOP RESET · CONTROLLER READY');});return;}
 cancelMotion();endMaintenance();state.mode='stopped';state.spindle=false;drawState();writeLog('SIMULATED E-STOP · MOTION STOPPED');
}
function warmup(){
 const oldRPM=state.rpm;const stages=[12000,15000,18000];state.mode='warm';state.spindle=true;
 function stage(i){
  if(state.mode!=='warm')return;
  if(i===stages.length){state.mode='ready';state.spindle=false;state.rpm=oldRPM;writeLog('WARMUP PREVIEW COMPLETE');drawState();return;}
  state.rpm=stages[i];drawState();writeLog('WARMUP PREVIEW · '+stages[i]+' RPM');warmTimer=setTimeout(()=>stage(i+1),1100);
 }stage(0);
}
function toggle(k){state[k]=!state[k];if(k==='vacuum')state.table=state.vacuum;
 if(k==='spindle')state.boot=state.gate=state.spindle;
 drawButtons();writeLog((({boot:'DUST BOOT',gate:'DUST GATE',table:'VAC TABLE'})[k]||k)+' '+(state[k]?'ON':'OFF'));
}
function mdi(text){
 const cmd=text.trim().toUpperCase();writeLog('MDI  '+cmd);
 if(['G43','G54','G98'].includes(cmd)){
  const alert=cmd==='G98';
  attr('mode-bg','fill',alert?'#e04343':'#ebebed');attr('mode-text','fill',alert?'white':'#262535');
  set('mode-text',cmd);writeLog(cmd+' BADGE PREVIEW');return;
 }
 if(/^T(0|[1-9]|1[0-2])$/.test(cmd))return pickup(Number(cmd.slice(1)));
 if(/^T([1-9]|1[0-2])\.1$/.test(cmd))return measure([Number(cmd.slice(1,-2))],false);
 if(/^M0?[35]$/.test(cmd)){const on=Number(cmd.slice(1))===3;if(state.spindle!==on)toggle('spindle');return;}
 if(/^S\d+$/.test(cmd)){const n=Number(cmd.slice(1));if(n<minRPM||n>maxRPM)return writeLog('RPM RANGE 200–18,000');state.rpm=n;drawButtons();return;}
 if(/^G0?[01]\s*(?:[XYZ]\s*[-+]?(?:\d+(?:\.\d*)?|\.\d+)\s*)+$/.test(cmd)){
  const pos=state.pos.slice();for(const [,axis,v] of cmd.matchAll(/([XYZ])\s*([-+]?(?:\d+(?:\.\d*)?|\.\d+))/g))pos[axes.indexOf(axis)]=Number(v)/unit()[1];state.pos=pos;drawPos();return;
 }
 writeLog('COMMAND OUTSIDE SIMULATED SUBSET');
}
function start(){
 if(['run','paused'].includes(state.mode))return runJob();if(state.mode!=='ready')return;
 const input=$control('mdi');if(input.value.trim()){mdi(input.value);input.value='';input.dispatchEvent(new Event('input'));}else runJob();
}
function press(c,e){
 if(c.kind==='menu')return topMenu(c.index);
 if(c.key==='history')return showHistory();if(c.key==='estop')return estop();if(c.key==='start')return start();
 if(state.mode!=='ready')return;
 if(c.kind==='tool'){
  if(e.shiftKey){if(state.selected.has(c.n))state.selected.delete(c.n);else state.selected.add(c.n);drawRack();}
  else pickup(c.n);return;
 }
 if(c.key==='measure')return measure([...state.selected].sort((a,b)=>a-b),true);
 if(c.key==='open')return openFile();
 if(c.key==='sweep'||c.key==='flycut')return startMaintenance(c.key);
 if(c.key==='warmup')return warmup();
 if(c.key==='park'||c.key==='home'){
  const park=c.key==='park';state.pos=park?[-1.3,-1.8,-11.824]:[0,0,0];if(park){state.tool=0;state.selected.clear();state.spindle=false;}
  drawState();writeLog(park?'PARKED · TOOL UNLOADED':'HOMING PREVIEW COMPLETE');return;
 }
 if(Object.hasOwn(preset,c.key)||c.key.startsWith('inc'))return setJog(c.key);
 if(['spindle','vacuum','table','boot','gate'].includes(c.key))return toggle(c.key);
 if(/^[xyz][pm]$/.test(c.key)&&e.detail===0)axisMove(c.key,.05);
}
function create(c){
 const input=['number','range','text'].includes(c.kind),el=document.createElement(input?'input':'button');
 el.id='control-'+c.key;el.className='hit '+c.kind;el.type=input?c.kind:'button';
 el.setAttribute('aria-label',c.label);el.title=Object.hasOwn(preset,c.key)?c.label+' · XY '+preset[c.key][0]+' / Z '+preset[c.key][2]+' IN/MIN':c.kind==='tool'?c.label+' · CLICK TO PICK UP · SHIFT-CLICK TO SELECT · RIGHT-CLICK TO MEASURE':c.label;
 Object.assign(el.style,{left:c.x/7.68+'%',top:c.y/10.24+'%',width:c.w/7.68+'%',height:c.h/10.24+'%'});
 if(c.clip)el.style.clipPath=c.clip;
 if(!input)el.onclick=e=>press(c,e);
 if(c.kind==='menu'){el.setAttribute('aria-haspopup','menu');el.setAttribute('aria-expanded','false');el.onpointerenter=()=>{if(rootMenu>=0&&rootMenu!==c.index)topMenu(c.index);};}
 if(c.kind==='tool'){el.oncontextmenu=e=>{e.preventDefault();if(state.mode==='ready')measure([c.n],false);};}
 if(/^[xyz][pm]$/.test(c.key)){el.onpointerdown=e=>pointerJog(e,c.key);el.onlostpointercapture=el.onpointercancel=el.onpointerup=stopJog;}
 if(c.kind==='number'){el.step='any';el.value=c.value;el.onfocus=()=>el.select();el.onblur=()=>{const n=el.valueAsNumber;
  if(Number.isFinite(n)&&state.mode==='ready'){const pos=c.key.startsWith('pos'),i=axes.indexOf(c.key.slice(-1));if(pos||n>=0)(pos?state.pos:state.feed)[i]=n/unit()[1]/(pos?1:state.override/100);}
  drawPos();const pos=c.key.startsWith('pos');el.value=by(c.key+'-text').textContent;
 };el.onkeydown=e=>{if(e.key==='Escape'){el.value=by(c.key+'-text').textContent;el.blur();}if(e.key==='Enter')el.blur();};}
 if(c.kind==='text'){el.autocomplete='off';el.spellcheck=false;el.oninput=()=>attr('mdiHint','opacity',el.value?0:1);el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();start();}};}
 if(c.key==='override'){
  el.min=5;el.max=200;el.step=5;el.value=state.override;el.setAttribute('aria-orientation','vertical');el.setAttribute('aria-valuetext',state.override+' percent');
  el.oninput=()=>{state.override=Number(el.value);drawOverride();};
 }
 if(c.key==='rpm'){el.min=minRPM;el.max=maxRPM;el.step=100;el.value=12000;el.oninput=()=>{state.rpm=Number(el.value);drawButtons();};}
 by('controls').append(el);
}
function showNative(path){
 showDialog(path.at(-1),path.join('  /  ')+' OPENS A NATIVE WINCNC WINDOW OR COMMAND ON THE CONTROLLER. THIS MOCKUP PREVIEWS ITS MENU LOCATION.');
}
function menuAction(id,path){
 if(id===32775)return openFile();
 if(id===32776)return showHistory();
 if(id===57664)return showDialog('ABOUT','WINCNC 3.1.00 · PORTRAIT INTERFACE MOCKUP · 768 × 1024');
 if([32781,32782,32783].includes(id))return setJog(['slow','medium','fast'][id-32781]);
 if([32784,32785,32786,32787].includes(id))return setJog('inc'+(32787-id));
 if(id===32788&&state.mode==='ready'){
  const lab=document.createElement('label');lab.textContent='JOG INCREMENT ('+unit()[0]+') ';
  const f=document.createElement('input');f.type='number';f.min='0.00001';f.step='any';f.value=state.inc*unit()[1];lab.append(f);
  return showDialog('CUSTOM JOG INCREMENT',lab,'APPLY',()=>{if(!(f.valueAsNumber>0)){f.reportValidity();return false;}state.inc=f.valueAsNumber/unit()[1];state.transit=null;drawButtons();writeLog('CUSTOM JOG '+state.inc+' IN');});
 }
 if(id>=32823&&id<=32825){state.unit=['INCHES','CENTIMETERS','MILLIMETERS'][id-32823];drawPos();writeLog('READOUT IN '+state.unit);return;}
 if(id===32780&&state.mode==='ready')return runJob();
 if(id===32821){historyRows.push(['',''],['','']);writeLog('CONSOLE CLEARED');return;}
 if(id===32812||id===32779){drawPos();return writeLog('VIEW REFRESHED');}
 if(id===32854)return showDialog('OUTPUTS',['spindle','vacuum','table','boot','gate'].map(k=>(({table:'VAC TABLE',boot:'DUST BOOT',gate:'DUST GATE'})[k]||k.toUpperCase())+'  '+(state[k]?'ON':'OFF')).join('\n'));
 if(id===32863)return showDialog('POSITION INFORMATION',axes.map((a,i)=>a+'   '+(state.pos[i]*unit()[1]).toFixed(3)+' '+unit()[0]).join('\n'));
 if(id===32818)return showDialog('TOOL POSITIONS','12 RACK POSITIONS · '+(state.tool?'T'+state.tool+' ACTIVE':'NO ACTIVE TOOL'));
 return showNative(path);
}
function closeMenus(restore=false){
 const old=rootMenu;by('menus').replaceChildren();if(old>=0){$control('menu'+old).setAttribute('aria-expanded','false');if(restore)$control('menu'+old).focus();}rootMenu=-1;
}
function drop(items,path,anchor,level){
 const host=by('menus'),area=by('controller').getBoundingClientRect();
 [...host.children].slice(level).forEach(n=>n.remove());
 const box=document.createElement('div');box.className='popup';box.setAttribute('role','menu');box.setAttribute('aria-label',path.join(' / '));box._anchor=anchor;host.append(box);
 function removeDeeper(){[...host.children].slice(level+1).forEach(n=>n.remove());}
 for(const item of items){if(!item.name){box.append(document.createElement('hr'));continue;}
  const [name,shortcut]=item.name.replaceAll('&','').toUpperCase().split('\t');const b=document.createElement('button');
  b.type='button';b.setAttribute('role','menuitem');const label=document.createElement('span');label.textContent=name;b.append(label);
  if(shortcut||item.items){const hint=document.createElement('small');hint.textContent=item.items?'▸':shortcut;b.append(hint);}
  const open=()=>drop(item.items,[...path,name],b,level+1);
  if(item.items)b.setAttribute('aria-haspopup','menu');
  b.onpointerenter=()=>{if(item.items)open();else removeDeeper();};
  b.onclick=()=>{if(item.items){open().querySelector('button').focus();}else{closeMenus(true);menuAction(item.id,[...path,name]);}};
  b.onkeydown=e=>{
   const siblings=[...box.querySelectorAll('button')],i=siblings.indexOf(b);
   if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
    e.preventDefault();removeDeeper();siblings[e.key==='Home'?0:e.key==='End'?siblings.length-1:(i+(e.key==='ArrowUp'?-1:1)+siblings.length)%siblings.length].focus();
   }else if(e.key==='ArrowRight'&&item.items){e.preventDefault();open().querySelector('button').focus();}
   else if(e.key==='ArrowLeft'&&level){e.preventDefault();[...host.children].slice(level).forEach(n=>n.remove());anchor.focus();}
   else if(!level&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();topMenu((rootMenu+(e.key==='ArrowLeft'?-1:1)+menus.length)%menus.length,true);}
  };box.append(b);
 }
 const a=anchor.getBoundingClientRect(),r=box.getBoundingClientRect();
 let x=(level?a.right:a.left)-area.left,y=(level?a.top:a.bottom)-area.top;
 if(level&&x+r.width>area.width)x=a.left-area.left-r.width;
 x=clamp(x,0,Math.max(0,area.width-r.width));y=clamp(y,0,Math.max(0,area.height-r.height));
 box.style.left=x+'px';box.style.top=y+'px';return box;
}
function topMenu(i,focus=false){
 const same=rootMenu===i;closeMenus();if(same&&!focus)return;
 rootMenu=i;const anchor=$control('menu'+i);anchor.setAttribute('aria-expanded','true');
 const box=drop(menus[i].items,[menus[i].name.replaceAll('&','').toUpperCase()],anchor,0);
 if(focus)box.querySelector('button').focus();
}
spec.forEach(create);setGeometry(defaultJob);
for(let i=0;i<menus.length;i++)$control('menu'+i).onkeydown=e=>{if(['ArrowDown','Enter',' '].includes(e.key)){e.preventDefault();topMenu(i,true);}};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menus,.hit.menu'))closeMenus();});
document.addEventListener('keydown',e=>{
 if(by('dialog').open)return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='o'){e.preventDefault();closeMenus();openFile();return;}
 if(e.key==='Escape'){closeMenus(true);stopJog();return;}if(e.key==='Tab')closeMenus();
 if(e.target.matches('input')||e.altKey||e.ctrlKey||e.metaKey)return;
 const k=({F2:'slow',F3:'medium',F4:'fast',F6:'inc3',F7:'inc2',F8:'inc1',F9:'inc0'})[e.key];
 if(k){e.preventDefault();setJog(k);}
});
window.addEventListener('blur',()=>{closeMenus();stopJog();});window.addEventListener('resize',()=>closeMenus());
by('dlg-close').onclick=()=>by('dialog').close();drawState();
</script></body></html>
